spring:
  application:
    name: StudentArchives

  # ===== JPA 配置 =====
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  # ===== Flyway 配置 =====
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true
    table: flyway_schema_history

# ===== 日志配置 =====
logging:
  file:
    path: ./logs
  level:
    com.example.studentarchives: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    "org.hibernate.type.descriptor.sql": WARN

# ===== 服务器配置 =====
server:
  servlet:
    context-path: /api

# ===== JWT 配置 =====
jwt:
  secret: ry3PI9VzWou05VvcDoxd7zKBevj3YmTCqSULTOy3DCk=
  expiration-ms: 86400000
