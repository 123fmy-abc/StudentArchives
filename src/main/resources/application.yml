spring:
  application:
    name: StudentArchives #项目名
  profiles:
    active: dev
    # 个人配置（数据库密码、Redis索引、QQ邮箱）通过项目根目录 .env 文件加载
    # 参考 .env.example 创建自己的 .env 文件

  # ===== JPA 配置 （将Java对象与数据库表进行映射）=====
  jpa:
    hibernate:
      ddl-auto: validate #校验模式，启动时会检查数据库表结构和代码里的实体类是否一致。如果不一致会报错，但不会修改数据库
    show-sql: false #不在控制台打印 SQL 语句
    open-in-view: false #防止数据库连接长时间不释放导致性能问题。，否则整个请求过程数据库都是连接状态
    properties:
      hibernate:
        format_sql: true #自动格式化（换行缩进）
        create_empty_composites:
          enabled: true #即使数据全为null,还是会创建空对象防止报错
        jdbc:
          time_zone: Asia/Shanghai

  # ===== DevTools =====
  devtools:
    restart:
      enabled: false #关闭自动重启
    livereload:
      enabled: false #关闭浏览器自动刷新

  # ===== Flyway 配置（数据库管理工具） =====
  flyway:
    enabled: true
    locations: classpath:db/migration #指定 Flyway 扫描 SQL 脚本的路径。它会去项目的 resources/db/migration 目录下寻找需要执行的 SQL 文件
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true #发现内容被修改，会直接报错并阻止启动
    clean-disabled: true # 禁止执行clean命令
    table: flyway_schema_history
    repair: true #迁移失败时尝试自动修复
    repair-on-migration-failure: true

  # ===== Jackson 配置 =====
  #JSON 处理时的默认时区为上海，日期格式为 ISO 8601 标准格式
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd'T'HH:mm:ssXXX

  # ===== 文件上传配置 =====
  servlet:
    multipart:
      enabled: true
      max-file-size: 12MB        # 单个文件最大大小（需 > oss.max-file-size 的 10MB）
      max-request-size: 12MB     # 整个请求最大大小
      resolve-lazily: false      # 是否延迟解析（false=立即解析，可提前捕获异常）

  # ===== Redis 配置（连接参数由各 profile / .env 提供；开发默认本地 127.0.0.1）=====
  data:
    redis:
      timeout: 2000ms #连接超时时间
      database: ${REDIS_DATABASE:0} #指定连接 Redis 的哪一个数据库，先读取env中的，没有就用默认0
      lettuce: #连接池配置，通道（物理连接）的数量
        pool:
          max-active: 8 #连接池最大活跃连接数
          max-idle: 8 #连接池最大空闲连接数
          min-idle: 0 #连接池最小空闲连接数
          max-wait: 1000ms #获取连接的最大等待时间

# ===== 服务器配置 =====
server:
  port: 8080
  servlet:
    context-path: /api/v1

# ===== OSS 配置（fmy 配置，团队共享） =====
# 通过 .env 文件注入以下环境变量：
# OSS_ENDPOINT, OSS_ACCESS_KEY_ID, OSS_ACCESS_KEY_SECRET, OSS_BUCKET_NAME
oss:
  endpoint: ${OSS_ENDPOINT:} #访问域名
  access-key-id: ${OSS_ACCESS_KEY_ID:} #登录阿里云 OSS 的“用户名”
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:} #阿里云 OSS 的“密码”
  bucket-name: ${OSS_BUCKET_NAME:} #存储空间名称
  max-file-size: 10485760           # 文件上传最大大小（字节），默认 10MB
  temp-expire-hours: 24             # 临时文件过期时间（小时）
  url-expire-minutes: 30            # 临时访问 URL 过期时间（分钟）

# ===== DeepSeek 配置（lzw 配置，AI 对话模块） =====
deepseek:
  # API Key 通过项目根目录 .env 文件注入（DEEPSEEK_API_KEY=sk-xxx）
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  timeout-ms: ${DEEPSEEK_TIMEOUT_MS:60000}
  max-tokens: ${DEEPSEEK_MAX_TOKENS:2000}
  temperature: ${DEEPSEEK_TEMPERATURE:0.7}

# ===== JWT 配置 =====
jwt:
  # 必须通过环境变量 JWT_SECRET 注入 Base64 编码的 HMAC-SHA256 密钥（至少 256 位）。
  # 禁止将真实密钥写入配置文件或提交到版本库。
  secret: ${JWT_SECRET:}
  expiration-ms: 86400000 #Access Token 有效期，24小时
  refresh-expiration-ms: 604800000 #Refresh Token 有效期，7天

# ===== 档案导出模板渲染配置 =====
student:
  export:
    # 中文字体文件路径（可选）。为空时自动探测常见系统字体（Windows 微软雅黑/黑体、Linux Noto Sans CJK/文泉驿）。
    # 生产容器（Dockerfile 已安装 font-noto-cjk）无需配置。
    font-path: ${STUDENT_EXPORT_FONT_PATH:} #指定一个中文字体文件

# ===== 日志配置 =====
#日志级别从低到高依次为：TRACE < DEBUG < INFO < WARN < ERROR。配置了某个级别后，只会打印该级别及更高级别的日志。
logging:
  file:
    path: ./logs
  level:
    com.example.studentarchives: INFO #业务代码只打印 INFO 及以上级别
    org.springframework.security: WARN #Spring Security（安全框架）只打印 WARN 及以上级别
    org.hibernate.SQL: DEBUG  #JPA/Hibernate 底层会打印 DEBUG 级别的日志
    "org.hibernate.type.descriptor.sql": TRACE #打印 SQL 语句中的具体参数值
