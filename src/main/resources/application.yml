spring:
  application:
    name: StudentArchives
  profiles:
    active: dev
    # 个人配置（数据库密码、Redis索引、QQ邮箱）通过项目根目录 .env 文件加载
    # 参考 .env.example 创建自己的 .env 文件

  # ===== JPA 配置 =====
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai

  # ===== DevTools =====
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

  # ===== Flyway 配置 =====
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true
    table: flyway_schema_history
    repair: true
    repair-on-migration-failure: true

  # ===== Jackson 配置 =====
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd'T'HH:mm:ssXXX

  # ===== 文件上传配置 =====
  servlet:
    multipart:
      enabled: true
      max-file-size: 12MB        # 单个文件最大大小（需 > oss.max-file-size 的 10MB）
      max-request-size: 12MB     # 整个请求最大大小
      resolve-lazily: false      # 是否延迟解析（false=立即解析，可提前捕获异常）

  # ===== Redis 配置（远程共享）=====
  # 通过 database 索引隔离不同开发者的缓存数据
  data:
    redis:
      timeout: 2000ms
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 1000ms

# ===== 服务器配置 =====
server:
  port: 8080
  servlet:
    context-path: /api/v1

# ===== OSS 配置（fmy 配置，团队共享） =====
# 通过 .env 文件注入以下环境变量：
#   OSS_ENDPOINT, OSS_ACCESS_KEY_ID, OSS_ACCESS_KEY_SECRET, OSS_BUCKET_NAME
oss:
  endpoint: ${OSS_ENDPOINT:}
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  bucket-name: ${OSS_BUCKET_NAME:}
  max-file-size: 10485760           # 文件上传最大大小（字节），默认 10MB
  temp-expire-hours: 24             # 临时文件过期时间（小时）
  url-expire-minutes: 30            # 临时访问 URL 过期时间（分钟）

# ===== JWT 配置 =====
jwt:
  # 必须通过环境变量 JWT_SECRET 注入 Base64 编码的 HMAC-SHA256 密钥（至少 256 位）。
  # 禁止将真实密钥写入配置文件或提交到版本库。
  # 生成示例（PowerShell）：
  #   $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
  #   $bytes = New-Object byte[] 32
  #   $rng.GetBytes($bytes)
  #   [Convert]::ToBase64String($bytes)
  secret: ${JWT_SECRET:}
  expiration-ms: 86400000
  refresh-expiration-ms: 604800000

# ===== 日志配置 =====
logging:
  file:
    path: ./logs
  level:
    com.example.studentarchives: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: DEBUG
    "org.hibernate.type.descriptor.sql": TRACE
