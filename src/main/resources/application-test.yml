# ===== 测试环境配置 =====
#
# 用途：端到端自动化测试时免去人工输入图形验证码。
#
# 启动方式（application.yml 里 active: dev 保持不变，启动时覆盖即可）：
#   mvn spring-boot:run -Dspring-boot.run.profiles=test
#   java -jar xxx.jar --spring.profiles.active=test
#
# 基础设施配置（数据库 / Redis / 邮件）全部继承 application-dev.yml ——
# 见 application.yml 里的 spring.profiles.group: test -> dev。
# 也就是说本 profile 激活后 activeProfiles = [test, dev]。
#
# 生效规则（任一不满足即走正常验证码校验，详见 support/CaptchaSkipPolicy）：
#   1. 当前不处于任何生产 profile（硬编码守卫，无法绕过）
#   2. 下面 5 项配置齐全
#   3. 请求携带约定请求头且密钥正确
#   4. 登录账号在 skip-users 白名单内
# → 正式账号、以及缺少密钥的请求，依然强制校验验证码。

auth:
  captcha:
    # 免验证码总开关（对应需求中的 skipCodeVerify）
    skip-code-verify: true

    # 允许启用免验证码的 profile 白名单。
    # 代码要求「当前所有 active profile 都必须在名单内」才生效；
    # test profile 会同时激活 dev，所以这里必须把 dev 一起写上。
    # prod 永远不在此名单内 —— 生产无法通过任何参数启用本能力。
    skip-allowed-profiles:
      - dev
      - test

    # 仅这些账号可以免验证码登录；其余账号照常校验。
    # 按需增删，改完重启生效。
    skip-users:
      - 202401002
      - A00002
      - T00003

    # 调用免验证码能力必须携带的请求头名称
    skip-header-name: X-Captcha-Skip-Token

    # 密钥，禁止硬编码，从项目根目录 .env 注入：CAPTCHA_SKIP_SECRET=xxx
    # 留空则免验证码能力整体失效（fail closed）。
    skip-secret: ${CAPTCHA_SKIP_SECRET:}
