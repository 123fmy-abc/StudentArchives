# ===== 开发环境配置 =====
#
# 使用方式：
#   1. 拷贝项目根目录 .env.example 为 .env
#   2. 填入自己的数据库 / QQ 邮箱配置（Redis 默认连本地，一般不用改）
#   3. 启动即可（Spring Boot 自动加载 .env）
#
# 团队共享说明：
#   - MySQL：默认连接远程共享数据库（如需本地库，在 .env 覆盖 DB_HOST 等）
#   - Redis：默认连接各自的本地 Redis（127.0.0.1），各用各的、互不干扰
#   - QQ 邮箱：每人配置自己的邮箱和 SMTP 授权码
#


spring:
  # ===== Flyway（开发环境允许补跑漏掉的迁移）=====
  flyway:
    out-of-order: true #允许乱序执行迁移文件
    ignore-migration-patterns: "*:missing" #忽略缺失的迁移脚本，执行过迁移，但数据库里面没有表

  # ===== 数据源（远程共享 MySQL，全体队员使用同一数据库）=====
  datasource:
    url: jdbc:mysql://${DB_HOST:8.137.191.26}:${DB_PORT:3306}/${DB_NAME:student_archives}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=true&allowPublicKeyRetrieval=false
    username: ${DB_USERNAME:StuArch}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver #用哪个底层工具包去和 MySQL 数据库进行通信。
    hikari: #连接池配置
      maximum-pool-size: 10 #连接池里最多同时存在 10 个数据库连接
      minimum-idle: 3 #连接池里最少保持 3 个空闲的连接
      connection-timeout: 30000 #获取连接超时时间
      idle-timeout: 600000 #空闲连接存活时间，超过就会被回收
      max-lifetime: 1800000 #存活时间达到 30 分钟，就会被强制关闭并创建新连接

  # ===== Redis（各自连接自己的本地 Redis，默认 127.0.0.1:6379）=====
  # 本地 Redis 未设置密码时，在 .env 里把 REDIS_PASSWORD 留空即可。
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DATABASE:0}

  # ===== QQ 邮件（每人独立配置）=====
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME} #qq邮箱
    password: ${MAIL_PASSWORD} #授权码
    properties:
      mail.from: ${MAIL_USERNAME} #设置邮件的默认发件人地址
      mail.smtp.auth: true #在发送邮件前需要先验证 username 和 password
      mail.smtp.starttls.enable: true #账号、密码和邮件内容在传输过程中是加密的
      mail.smtp.timeout: 5000 #SMTP 操作的超时时间，毫秒
      mail.smtp.connectiontimeout: 5000 #设置建立网络连接的超时时间

# ===== OSS 配置 =====
# 与 application.yml 一致的 oss 配置通过 .env 注入以下环境变量：
# OSS_ENDPOINT, OSS_ACCESS_KEY_ID, OSS_ACCESS_KEY_SECRET, OSS_BUCKET_NAME
# 团队所有成员使用 fmy 配置的同一 OSS，只需在 .env 中填入相同密钥即可共享。

# ===== JWT 密钥（开发环境也不提供默认值，必须在 .env 中设置 JWT_SECRET）=====
jwt:
  secret: ${JWT_SECRET:}

# ===== 测试环境配置 =====
#
# 用途：端到端自动化测试时免去人工输入图形验证码。
#
# 启动方式（application.yml 里 active: dev 保持不变，启动时覆盖即可）：
#   mvn spring-boot:run -Dspring-boot.run.profiles=test
#   java -jar xxx.jar --spring.profiles.active=test
#
# 基础设施配置（数据库 / Redis / 邮件）全部继承 application-dev.yml ——
# 见 application.yml 里的 spring.profiles.group: test -> dev。
# 也就是说本 profile 激活后 activeProfiles = [test, dev]。
#
# 生效规则（任一不满足即走正常验证码校验，详见 support/CaptchaSkipPolicy）：
#   1. 当前不处于任何生产 profile（硬编码守卫，无法绕过）
#   2. 下面 5 项配置齐全
#   3. 请求携带约定请求头且密钥正确
#   4. 登录账号在 skip-users 白名单内
# → 正式账号、以及缺少密钥的请求，依然强制校验验证码。

auth:
  captcha:
    # 免验证码总开关（对应需求中的 skipCodeVerify）
    skip-code-verify: true

    # 允许启用免验证码的 profile 白名单。
    # 代码要求「当前所有 active profile 都必须在名单内」才生效；
    # test profile 会同时激活 dev，所以这里必须把 dev 一起写上。
    # prod 永远不在此名单内 —— 生产无法通过任何参数启用本能力。
    skip-allowed-profiles:
      - dev
      - test

    # 仅这些账号可以免验证码登录；其余账号照常校验。
    # 按需增删，改完重启生效。
    skip-users:
      - 202401002
      - A00002
      - T00003

    # 调用免验证码能力必须携带的请求头名称
    skip-header-name: X-Captcha-Skip-Token

    # 密钥，禁止硬编码，从项目根目录 .env 注入：CAPTCHA_SKIP_SECRET=xxx
    # 留空则免验证码能力整体失效（fail closed）。
    skip-secret: ${CAPTCHA_SKIP_SECRET:}
