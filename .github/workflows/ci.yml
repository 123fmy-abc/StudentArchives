name: CI（编译校验）

# ⚠️ 为什么这里只构建、不部署：
# 实测 GitHub 海外构建节点 → 大陆服务器 传输速率约 23 KB/s，92MB 的 fat jar 需要约 68 分钟，
# 因此「CI 构建产物 → scp 传服务器」的路线在本项目不可用（详见 docs 部署指南）。
# 本工作流只做编译校验，挡住编译不过的代码；实际部署走本地一键脚本 deploy-local.ps1。
#
# 部署方式（在本地仓库根目录）：
#   powershell -ExecutionPolicy Bypass -File deploy-local.ps1
# 流程：本地 mvnw 构建 → scp 上传(1.5MB/s, 约1分钟) → 服务器备份/替换/重启/健康检查/失败回滚

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'   # 与 pom.xml <java.version>21</java.version>、服务器 JDK 21 一致
          distribution: 'temurin'
          cache: 'maven'

      - name: 编译打包（跳过测试）
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests package

      - name: 产物信息
        run: ls -lh target/student-archives-0.0.1-SNAPSHOT.jar
