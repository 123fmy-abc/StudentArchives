name: Deploy (jar + systemd)

# 自动化部署：push 到 main 或在 GitHub 网页手动触发。
# 流程：构建 jar → scp 上传到服务器临时目录 → 远程执行 deploy-jar.sh
#       （备份 → 替换 → systemctl restart → 健康检查 → 失败自动回滚）。
# 依赖仓库 Settings → Secrets and variables → Actions 里配置：
#   SSH_HOST        服务器 IP（如 111.228.56.207）
#   SSH_PORT        SSH 端口（通常 22）
#   SSH_USER        登录用户（通常 root）
#   SSH_PRIVATE_KEY 私钥全文（含 BEGIN/END 行，见 deploy/README.md）

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 构建 jar（跳过测试）
        run: |
          chmod +x mvnw
          ./mvnw -B -q -DskipTests package

      - name: 校验产物
        run: ls -lh target/student-archives-0.0.1-SNAPSHOT.jar

      - name: 上传 jar 与部署脚本
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "target/student-archives-0.0.1-SNAPSHOT.jar,deploy/deploy-jar.sh"
          target: "/tmp/stuarchives-deploy"
          overwrite: true

      - name: 远程部署（含健康检查与自动回滚）
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 15m
          script: |
            bash /tmp/stuarchives-deploy/deploy/deploy-jar.sh \
              /tmp/stuarchives-deploy/target/student-archives-0.0.1-SNAPSHOT.jar

      - name: 清理服务器临时文件
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: rm -rf /tmp/stuarchives-deploy
