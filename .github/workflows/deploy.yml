name: Deploy to BaoTa

on:
  push:
    branches: [ main ]        # 推送到 main 分支自动部署
  workflow_dispatch: {}       # 支持在 GitHub 网页上手动触发

env:
  IMAGE: ${{ secrets.ACR_HOST }}/${{ secrets.ACR_NAMESPACE }}/student-archives

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_HOST }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH 到宝塔服务器部署
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 10m
          script: |
            cd /www/wwwroot/studentarchives
            docker compose pull app
            docker compose up -d --no-deps app
            sleep 20
            HTTP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/auth/captcha || true)
            echo "health check HTTP_CODE=$HTTP_CODE"
            if [ -z "$HTTP_CODE" ] || [ "$HTTP_CODE" = "000" ]; then
              echo "应用未正常响应，打印最近日志："
              docker compose logs --tail=80 app
              exit 1
            fi
            docker compose ps
