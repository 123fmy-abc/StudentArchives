version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: stuarchives-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: student_archives
      # 应用使用「仅授权本库」的独立账号 StuArch（最小权限），root 仅用于容器内运维
      MYSQL_USER: StuArch
      # 口令必须由环境变量注入强口令；缺省直接构建失败，杜绝 root123 等弱口令（OPS-01 / BSR-24）
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set to a strong value}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set to a strong value}
    ports:
      # 仅绑定宿主机回环地址，禁止把 3306 暴露到公网（公网 3306 必须不可达）
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
      --default-time_zone=+8:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: stuarchives-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      LOG_PATH: /var/log/student-archives
      # 生产环境请通过 .env 文件或宿主机环境变量设置真实的 JWT_SECRET
      JWT_SECRET: ${JWT_SECRET:}
    ports:
      - "8080:8080"
    volumes:
      - app-logs:/var/log/student-archives

volumes:
  mysql-data:
  app-logs:
