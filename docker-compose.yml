version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: stuarchives-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: student_archives
      MYSQL_USER: StuArch
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
      --default-time_zone=+8:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: stuarchives-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      LOG_PATH: /var/log/student-archives
      # 生产环境请通过 .env 文件或宿主机环境变量设置真实的 JWT_SECRET
      JWT_SECRET: ${JWT_SECRET:}
    ports:
      - "8080:8080"
    volumes:
      - app-logs:/var/log/student-archives

volumes:
  mysql-data:
  app-logs:
